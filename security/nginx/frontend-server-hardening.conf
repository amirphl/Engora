# Add these directives inside the jazebeh.ir HTTPS `server { ... }` block.

# Nginx decodes %20 before matching locations. The original ZAP backup alert
# was a false positive caused by sending an unknown backup-looking URL through
# the React SPA fallback and receiving index.html with status 200.
location ~ "\\s" {
    return 404;
}

location ~* "(?:~|\\.(?:bak|backup|bkp|copy|old|orig|original|save|saved|swp|swo|tmp|temp))$" {
    return 404;
}

# Replace Nginx-branded method errors. OPTIONS for /api/ remains available
# because valid API/CORS requests are handled by the more-specific /api block.
error_page 405 = @method_not_allowed;
location @method_not_allowed {
    default_type text/plain;
    return 405 "Method not allowed\n";
}
